    <rect x="320" y="118" width="694" height="142" rx="22" fill="#fffaf9" stroke="#f7d1d6"/>
    <text x="348" y="160" fill="#b10f1c" font-family="Arial, sans-serif" font-size="22" font-weight="700">Live dashboard</text>
    <text x="348" y="208" fill="#170000" font-family="Arial, sans-serif" font-size="44" font-weight="900">2,846</text>
    <text x="560" y="208" fill="#b10f1c" font-family="Arial, sans-serif" font-size="44" font-weight="900">Active donors</text>

    <g>
