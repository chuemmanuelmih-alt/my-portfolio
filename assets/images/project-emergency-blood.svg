    <g>
      <rect x="666" y="286" width="348" height="252" rx="22" fill="#ffffff" stroke="#f7d1d6"/>
      <text x="690" y="324" fill="#b10f1c" font-family="Arial, sans-serif" font-size="22" font-weight="700">Recent requests</text>
      <rect x="690" y="345" width="300" height="52" rx="14" fill="#fff5f5"/>
      <circle cx="714" cy="371" r="12" fill="#b10f1c"/>
      <text x="736" y="378" fill="#0b0b0b" font-family="Arial, sans-serif" font-size="18" font-weight="700">O+ urgent - 12 units</text>
      <rect x="690" y="408" width="300" height="52" rx="14" fill="#fff5f5"/>
      <circle cx="714" cy="434" r="12" fill="#ef3a48"/>
      <text x="736" y="441" fill="#0b0b0b" font-family="Arial, sans-serif" font-size="18" font-weight="700">A- needed - 08 units</text>
      <rect x="690" y="471" width="300" height="52" rx="14" fill="#fff5f5"/>
      <circle cx="714" cy="497" r="12" fill="#ff5a5f"/>
      <text x="736" y="504" fill="#0b0b0b" font-family="Arial, sans-serif" font-size="18" font-weight="700">AB+ critical - 06 units</text>
    </g>
