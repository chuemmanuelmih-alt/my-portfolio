      <rect x="342" y="352" width="262" height="132" rx="18" fill="#ffe8ea"/>
      <rect x="356" y="433" width="26" height="32" rx="8" fill="#b10f1c"/>
      <rect x="396" y="404" width="26" height="61" rx="8" fill="#ef3a48"/>
      <rect x="436" y="398" width="26" height="67" rx="8" fill="#b10f1c"/>
      <rect x="476" y="374" width="26" height="91" rx="8" fill="#ef3a48"/>
      <rect x="516" y="345" width="26" height="120" rx="8" fill="#b10f1c"/>
      <rect x="556" y="382" width="26" height="83" rx="8" fill="#ef3a48"/>
