<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Emergency blood request system dashboard</title>
  <desc id="desc">A clean blue and aqua mockup of a blood donation request management dashboard.</desc>
  <defs>
    <linearGradient id="panelBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edfefe"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#0a13ff"/>
      <stop offset="100%" stop-color="#2ec7ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="#fff7f7"/>
  <rect width="1200" height="210" fill="#b10f1c"/>
  <rect y="210" width="1200" height="590" fill="#ffe8e8"/>

  <g transform="translate(80 105)">
    <rect x="0" y="0" width="1040" height="590" rx="30" fill="url(#panelBg)" stroke="#f7c9cf" stroke-width="3"/>

    <rect x="0" y="0" width="1040" height="82" rx="30" fill="#b10f1c"/>
    <circle cx="42" cy="41" r="9" fill="#ffffff" opacity="0.9"/>
    <circle cx="74" cy="41" r="9" fill="#ffffff" opacity="0.75"/>
    <circle cx="106" cy="41" r="9" fill="#ffffff" opacity="0.55"/>
    <text x="760" y="49" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" font-weight="700">Emergency Blood Care</text>

    <rect x="26" y="118" width="262" height="420" rx="22" fill="#fff2f2" stroke="#f7d1d6"/>
    <text x="44" y="156" fill="#b10f1c" font-family="Arial, sans-serif" font-size="24" font-weight="800">Quick Access</text>

    <g>
      <rect x="44" y="186" width="226" height="68" rx="16" fill="#ffe2e3"/>
      <circle cx="76" cy="220" r="18" fill="#b10f1c"/>
      <path d="M76 208c-7 0-12 6-12 13 0 8 12 19 12 19s12-11 12-19c0-7-5-13-12-13z" fill="#ffffff"/>
      <text x="108" y="228" fill="#b10f1c" font-family="Arial, sans-serif" font-size="22" font-weight="700">Blood Request</text>
    </g>

    <g>
      <rect x="44" y="274" width="226" height="68" rx="16" fill="#ffe2e3"/>
      <circle cx="76" cy="308" r="18" fill="#ef3a48"/>
      <text x="108" y="316" fill="#b10f1c" font-family="Arial, sans-serif" font-size="22" font-weight="700">Donor Match</text>
    </g>

    <g>
      <rect x="44" y="362" width="226" height="68" rx="16" fill="#ffe2e3"/>
      <circle cx="76" cy="396" r="18" fill="#ff5a5f"/>
      <text x="108" y="404" fill="#b10f1c" font-family="Arial, sans-serif" font-size="22" font-weight="700">Urgent Cases</text>
    </g>

    <g>
      <rect x="44" y="450" width="226" height="62" rx="18" fill="#ffd9dc"/>
      <text x="58" y="489" fill="#b10f1c" font-family="Arial, sans-serif" font-size="22" font-weight="700">Need Help Now</text>
